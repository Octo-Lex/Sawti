name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Portability guard (no committed CUDA pins)
        run: uv run python scripts/check_portable_config.py

      - name: Install (portable CPU resolution — proves clean-checkout works)
        run: uv sync --dev

      - name: Model registry gate (license invariant)
        run: uv run python scripts/check_model_registry.py

      - name: Segmentation boundary-F1 gate (spec 7.4 regression, CPU)
        run: uv run python scripts/segment_boundary_eval.py --gate

      - name: Hermetic test suite (integration auto-skipped)
        run: uv run pytest
